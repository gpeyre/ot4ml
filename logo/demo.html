<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OT4ML Logo Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6fa;
      --panel: #ffffff;
      --line: #e1e4ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 10px 12px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(21, 24, 34, 0.06);
    }
  </style>
</head>
<body>
  <main>
    <div id="ot4ml-logo-demo"></div>
  </main>

  <script src="ot4ml-logo-embed.js"></script>
  <script>
    OT4MLLogo.create("#ot4ml-logo-demo");
  </script>
</body>
</html>
